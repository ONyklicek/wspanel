# One privileged container = one "server". Do not split services into
# separate containers: production is a single host running systemd units.
services:
  devserver:
    build: .
    hostname: wspanel-dev
    privileged: true          # systemd, ACLs, nftables (UFW) inside the container's own namespaces
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ..:/opt/wspanel:ro    # repo read-only: install.sh copies what it needs
    ports:
      - "8080:80"
      - "8443:443"
      - "2222:22"
