# A release: push a tag v1.2.0 (or v1.2.0-rc1 for a pre-release) and this
# builds the bundles for amd64 and arm64, installs each on a clean Debian 13
# (dev/release-smoke.sh), and only then publishes them as a GitHub release
# with checksums and build provenance.
#
# Run it by hand (Actions → Release → Run workflow) to build and test a
# version without publishing anything.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without v), e.g. 1.2.0-test"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Bundle ${{ matrix.arch }}
    needs: checks
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the packages' changelog: commits since the previous tag
      - id: version
        name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }} # never spliced into the script itself
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then v="${GITHUB_REF_NAME#v}"; else v="${INPUT_VERSION}"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      # Changes since the previous published release (a tag whose release
      # failed has none, and its changes belong to this one).
      - name: Previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "WSPANEL_SINCE=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')" >> "$GITHUB_ENV"
      - name: Build
        env:
          WSPANEL_REPO: ${{ github.repository }} # the panel looks here for newer releases
        run: provision/bundle.sh "${{ steps.version.outputs.version }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.arch }}
          path: dist/wspanel-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
      # The wspanel package (installer and panel, any architecture): once.
      - name: The wspanel package
        if: matrix.arch == 'amd64'
        run: provision/build-installer-deb.sh dist/wspanel-*-linux-amd64.tar.gz dist/deb
      # Debian's own checks of all three packages: errors stop the release.
      - name: Lintian
        run: |
          # The runner image's package index goes stale (a security update
          # replaces the .deb it names): fresh index, and a retry.
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q --no-install-recommends lintian >/dev/null \
            || { sleep 30; sudo apt-get update -q >/dev/null && sudo apt-get install -y -q --no-install-recommends lintian >/dev/null; }
          mkdir -p dist/lint
          tar -xzf dist/wspanel-*-linux-${{ matrix.arch }}.tar.gz -C dist/lint --strip-components=2 --wildcards 'wspanel/bin/*.deb'
          debs=(dist/lint/*.deb)
          [[ "${{ matrix.arch }}" == amd64 ]] && debs+=(dist/deb/*.deb)
          lintian --fail-on error --tag-display-limit 0 "${debs[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.arch == 'amd64'
        with:
          name: deb-wspanel
          path: dist/deb/wspanel_*_all.deb
          if-no-files-found: error

  smoke:
    name: Install test ${{ matrix.arch }} (${{ matrix.via }})
    needs: build
    # Each bundle on its own architecture, and the apt way (README "Instalace
    # přes apt") from the packages. The arm64 runners are free for public
    # repositories; a private one without them: drop that entry.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            via: bundle
          - arch: arm64
            runner: ubuntu-24.04-arm
            via: bundle
          - arch: amd64
            runner: ubuntu-24.04
            via: apt
          # A server on the previous release, upgraded to this one.
          - arch: amd64
            runner: ubuntu-24.04
            via: upgrade
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundle-${{ matrix.arch }}
          path: dist
      - name: Install on a clean Debian 13, use it, upgrade it (bundle)
        if: matrix.via == 'bundle'
        run: dev/release-smoke.sh dist/wspanel-*-linux-${{ matrix.arch }}.tar.gz
      - name: The previous release, upgraded to this one
        if: matrix.via == 'upgrade'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [[ -z "$prev" ]]; then echo "no published release yet: nothing to upgrade from"; exit 0; fi
          SMOKE_REPO="${GITHUB_REPOSITORY}" dev/release-smoke.sh --from "${prev#v}" dist/wspanel-*-linux-${{ matrix.arch }}.tar.gz
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.via == 'apt'
        with:
          name: deb-wspanel
          path: dist/debs
      - name: Install on a clean Debian 13 through apt, use it, wspanel-update
        if: matrix.via == 'apt'
        run: |
          tar -xzf dist/wspanel-*-linux-${{ matrix.arch }}.tar.gz -C dist/debs --strip-components=2 --wildcards 'wspanel/bin/*.deb'
          dev/release-smoke.sh --apt dist/debs

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # the release
      id-token: write     # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deb-wspanel
          path: dist
      - name: One-command installer
        # It verifies the signed checksums with the apt repository's key,
        # carried inside it (gpgv reads a binary keyring).
        run: |
          key=$(gpg --dearmor < provision/files/wspanel-archive-keyring.asc | base64 -w0)
          sed -e "s|@REPO@|${GITHUB_REPOSITORY}|g" -e "s|@KEYRING@|${key}|" provision/get.sh > dist/get.sh
          if grep -q '@KEYRING@' dist/get.sh; then echo "get.sh carries no signing key"; exit 1; fi
      - name: Agent and keyring packages (.deb) from the bundles
        run: for b in dist/wspanel-*.tar.gz; do tar -xzf "$b" -C dist --strip-components=2 --wildcards 'wspanel/bin/*.deb'; done; ls dist/*.deb
      - name: Checksums
        working-directory: dist
        run: sha256sum wspanel-*.tar.gz wspanel-agent_*.deb wspanel_*_all.deb wspanel-archive-keyring_*.deb get.sh | tee SHA256SUMS
      # Signed with the apt repository's key: files and SHA256SUMS changed
      # together in the release do not pass get.sh any more.
      - name: Signed checksums
        working-directory: dist
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          [[ -n "$APT_SIGNING_KEY" ]] || { echo "the APT_SIGNING_KEY secret is missing"; exit 1; }
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --import <<<"$APT_SIGNING_KEY"
          want=$(gpg --batch --with-colons --import-options show-only --import ../provision/files/wspanel-archive-keyring.asc | awk -F: '/^fpr/{print $10; exit}')
          gpg --batch --list-secret-keys "$want" >/dev/null || { echo "APT_SIGNING_KEY is not the key in provision/files/wspanel-archive-keyring.asc"; exit 1; }
          gpg --batch --yes --armor --local-user "$want" --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpg --dearmor < ../provision/files/wspanel-archive-keyring.asc > "$GNUPGHOME/release.gpg"
          gpgv --keyring "$GNUPGHOME/release.gpg" SHA256SUMS.asc SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/wspanel-*.tar.gz
            dist/wspanel-agent_*.deb
            dist/wspanel_*_all.deb
            dist/wspanel-archive-keyring_*.deb
            dist/get.sh
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The previous published release (a tag whose release failed has none).
          prev=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          {
            echo "## Instalace"
            echo
            echo "Na čistém Debianu 13 (amd64 nebo arm64), jedním příkazem:"
            echo
            echo '```'
            echo "curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/get.sh | sudo bash"
            echo '```'
            echo
            echo "Tato verze: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/get.sh | sudo env WSPANEL_VERSION=${{ needs.build.outputs.version }} bash\`."
            echo "Ručně: stáhnout \`wspanel-${{ needs.build.outputs.version }}-linux-<arch>.tar.gz\`, rozbalit a spustit \`sudo ./install\`."
            echo "Aktualizace: týž příkaz na nainstalovaném serveru (nabídne aktualizaci se stávajícím nastavením)."
            echo "Ověření: \`gpgv\` podpisu \`SHA256SUMS.asc\` klíčem apt repozitáře (get.sh to dělá sám), \`sha256sum -c SHA256SUMS\` a \`gh attestation verify <soubor> --repo ${GITHUB_REPOSITORY}\`."
            echo
            echo "## Změny"
            echo
            git log --no-merges --format='- %s' ${prev:+$prev..}"${GITHUB_REF_NAME}"
          } > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; [[ "${GITHUB_REF_NAME}" == *-* ]] && pre="--prerelease"
          gh release create "${GITHUB_REF_NAME}" dist/wspanel-*.tar.gz dist/wspanel-agent_*.deb dist/wspanel_*_all.deb dist/wspanel-archive-keyring_*.deb dist/get.sh dist/SHA256SUMS dist/SHA256SUMS.asc \
            --title "WSPanel ${{ needs.build.outputs.version }}" --notes-file notes.md --verify-tag $pre

  apt:
    # The packages into the apt repository (apt.yml).
    if: github.ref_type == 'tag'
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/apt.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
