# A release: push a tag v1.2.0 (or v1.2.0-rc1 for a pre-release) and this
# builds the bundles for amd64 and arm64, installs each on a clean Debian 13
# (dev/release-smoke.sh), and only then publishes them as a GitHub release
# with checksums and build provenance.
#
# Run it by hand (Actions → Release → Run workflow) to build and test a
# version without publishing anything.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without v), e.g. 1.2.0-test"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Bundle ${{ matrix.arch }}
    needs: checks
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }} # never spliced into the script itself
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then v="${GITHUB_REF_NAME#v}"; else v="${INPUT_VERSION}"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Build
        env:
          WSPANEL_REPO: ${{ github.repository }} # the panel looks here for newer releases
        run: provision/bundle.sh "${{ steps.version.outputs.version }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.arch }}
          path: dist/wspanel-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
      # The wspanel package (installer and panel, any architecture): once.
      - name: The wspanel package
        if: matrix.arch == 'amd64'
        run: provision/build-installer-deb.sh dist/wspanel-*-linux-amd64.tar.gz dist/deb
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'amd64'
        with:
          name: deb-wspanel
          path: dist/deb/wspanel_*_all.deb
          if-no-files-found: error

  smoke:
    name: Install test ${{ matrix.arch }} (${{ matrix.via }})
    needs: build
    # Each bundle on its own architecture, and the apt way (README "Instalace
    # přes apt") from the packages. The arm64 runners are free for public
    # repositories; a private one without them: drop that entry.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            via: bundle
          - arch: arm64
            runner: ubuntu-24.04-arm
            via: bundle
          - arch: amd64
            runner: ubuntu-24.04
            via: apt
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle-${{ matrix.arch }}
          path: dist
      - name: Install on a clean Debian 13, use it, upgrade it (bundle)
        if: matrix.via == 'bundle'
        run: dev/release-smoke.sh dist/wspanel-*-linux-${{ matrix.arch }}.tar.gz
      - uses: actions/download-artifact@v4
        if: matrix.via == 'apt'
        with:
          name: deb-wspanel
          path: dist/debs
      - name: Install on a clean Debian 13 through apt, use it, wspanel-update
        if: matrix.via == 'apt'
        run: |
          tar -xzf dist/wspanel-*-linux-${{ matrix.arch }}.tar.gz -C dist/debs --strip-components=2 --wildcards 'wspanel/bin/*.deb'
          dev/release-smoke.sh --apt dist/debs

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # the release
      id-token: write     # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: deb-wspanel
          path: dist
      - name: One-command installer
        run: sed "s|@REPO@|${GITHUB_REPOSITORY}|g" provision/get.sh > dist/get.sh
      - name: Agent packages (.deb) from the bundles
        run: for b in dist/wspanel-*.tar.gz; do tar -xzf "$b" -C dist --strip-components=2 --wildcards 'wspanel/bin/*.deb'; done; ls dist/*.deb
      - name: Checksums
        working-directory: dist
        run: sha256sum wspanel-*.tar.gz wspanel-agent_*.deb wspanel_*_all.deb get.sh | tee SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/wspanel-*.tar.gz
            dist/wspanel-agent_*.deb
            dist/wspanel_*_all.deb
            dist/get.sh
      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Instalace"
            echo
            echo "Na čistém Debianu 13 (amd64 nebo arm64), jedním příkazem:"
            echo
            echo '```'
            echo "curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/get.sh | sudo bash"
            echo '```'
            echo
            echo "Tato verze: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/get.sh | sudo env WSPANEL_VERSION=${{ needs.build.outputs.version }} bash\`."
            echo "Ručně: stáhnout \`wspanel-${{ needs.build.outputs.version }}-linux-<arch>.tar.gz\`, rozbalit a spustit \`sudo ./install\`."
            echo "Aktualizace: týž příkaz na nainstalovaném serveru (nabídne aktualizaci se stávajícím nastavením)."
            echo "Ověření: \`sha256sum -c SHA256SUMS\` a \`gh attestation verify <soubor> --repo ${GITHUB_REPOSITORY}\`."
            echo
            echo "## Změny"
            echo
            git log --no-merges --format='- %s' ${prev:+$prev..}"${GITHUB_REF_NAME}"
          } > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; [[ "${GITHUB_REF_NAME}" == *-* ]] && pre="--prerelease"
          gh release create "${GITHUB_REF_NAME}" dist/wspanel-*.tar.gz dist/wspanel-agent_*.deb dist/wspanel_*_all.deb dist/get.sh dist/SHA256SUMS \
            --title "WSPanel ${{ needs.build.outputs.version }}" --notes-file notes.md --verify-tag $pre

  apt:
    # The agent's packages into the apt repository (apt.yml).
    if: github.ref_type == 'tag'
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/apt.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
