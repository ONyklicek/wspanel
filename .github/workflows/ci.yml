# Checks on every push and pull request: the agent (Go), the panel
# (Laravel), the provisioning scripts. The release workflow runs the same
# before it builds anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent (Go)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w"; exit 1; }
      - name: vet (linux/amd64, linux/arm64)
        run: |
          GOOS=linux GOARCH=amd64 go vet ./...
          GOOS=linux GOARCH=arm64 go vet ./...
      - name: test
        run: go test ./...

  panel:
    name: Panel (Laravel)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: intl, sqlite3, pdo_sqlite, mbstring, zip, gd, bcmath
          coverage: none
          tools: composer:v2
      - name: Composer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('panel/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci && npm run build
      - name: Pint
        run: vendor/bin/pint --test
      - name: Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test --compact

  provision:
    name: Provisioning scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bash syntax
        run: for f in provision/*.sh dev/*.sh; do bash -n "$f" || exit 1; done
