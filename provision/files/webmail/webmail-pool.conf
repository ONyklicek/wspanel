; Managed by WSPanel (mail-hosting.sh). Roundcube: own user, no access to
; sites, the panel or the agent. Reaches mail over the loopback only.
[webmail]
user = webmail
group = webmail
listen = /run/php/php__PHP__-webmail.sock
listen.owner = panel-web
listen.group = panel-web
listen.mode = 0660
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
chdir = /
security.limit_extensions = .php
env[TMPDIR] = /var/lib/wspanel-webmail/temp
php_admin_value[open_basedir] = /usr/share/roundcube/:/var/lib/roundcube/:/etc/roundcube/:/usr/share/php/:/usr/share/javascript/:/usr/share/nodejs/:/var/lib/wspanel-webmail/:/run/wspanel-webmail/:/usr/share/zoneinfo/
php_admin_value[upload_tmp_dir] = /var/lib/wspanel-webmail/temp
php_admin_value[sys_temp_dir] = /var/lib/wspanel-webmail/temp
php_admin_value[session.save_path] = /var/lib/wspanel-webmail/temp
php_admin_value[upload_max_filesize] = 25M
php_admin_value[post_max_size] = 30M
php_admin_value[memory_limit] = 256M
php_admin_flag[display_errors] = off
php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,putenv,dl
