; Managed by WSPanel install.sh. phpMyAdmin + Adminer: own user, no access
; to sites, the panel or the agent. Credentials only arrive via one-time
; tokens from the agent (/run/wspanel-dbtools).
[dbtools]
user = dbtools
group = dbtools
listen = /run/php/php8.4-dbtools.sock
listen.owner = panel-web
listen.group = panel-web
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
chdir = /
security.limit_extensions = .php
env[TMPDIR] = /var/lib/wspanel-dbtools/tmp
php_admin_value[open_basedir] = /usr/share/wspanel-dbtools/:/etc/wspanel-dbtools/:/var/lib/wspanel-dbtools/:/run/wspanel-dbtools/
php_admin_value[upload_tmp_dir] = /var/lib/wspanel-dbtools/tmp
php_admin_value[sys_temp_dir] = /var/lib/wspanel-dbtools/tmp
php_admin_value[session.save_path] = /var/lib/wspanel-dbtools/sessions
php_admin_value[session.cookie_secure] = 1
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_samesite] = Strict
php_admin_value[session.use_strict_mode] = 1
; A phpMyAdmin login lives as long as its temporary database user (30 min,
; LoginCookieValidity): the session must outlive it. Debian's own session
; cleaner sweeps only /var/lib/php/sessions, so this pool cleans its own.
php_admin_value[session.gc_maxlifetime] = 3600
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 100
; Imports and exports of whole databases: large uploads, long runs.
php_admin_value[upload_max_filesize] = 1G
php_admin_value[post_max_size] = 1G
php_admin_value[memory_limit] = 1G
php_admin_value[max_execution_time] = 1800
php_admin_value[max_input_time] = 1800
php_admin_value[max_input_vars] = 10000
php_admin_flag[display_errors] = off
php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,putenv,dl
