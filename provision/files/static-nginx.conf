# Managed by WSPanel. Static files of classic sites. The web tier
# (panel-web) routes every request and hands a static one here with the
# site's root; nginx opens no symlink whose target has another owner, so a
# site cannot serve another site's files (its wp-config.php, a page behind
# its password) by linking to them. Caddy follows any symlink.
worker_processes auto;
worker_rlimit_nofile 65536;
pid /run/panel-static/nginx.pid;
error_log stderr error;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 120s;
    keepalive_requests 100000;
    # Requests carry no body here; nginx still wants writable temp paths.
    client_body_temp_path /run/panel-static/body;
    proxy_temp_path /run/panel-static/proxy;
    fastcgi_temp_path /run/panel-static/fastcgi;
    uwsgi_temp_path /run/panel-static/uwsgi;
    scgi_temp_path /run/panel-static/scgi;
    # A .gz / .br next to a file (a build step's output) is sent as it is;
    # the edge compresses the rest.
    gzip_static on;
    gzip_vary on;
    brotli_static on;
    # Redirects (a directory's slash) stay relative: behind the edge, this
    # server's own name and port are nobody's business.
    absolute_redirect off;
    # Open files are kept a moment: a deploy's new release shows within it.
    open_file_cache max=20000 inactive=60s;
    open_file_cache_valid 5s;
    open_file_cache_errors off;
    # From the sites' root on: a site's own current and public are symlinks
    # it may repoint (at another site's release), so they are checked too.
    disable_symlinks if_not_owner from=/srv/sites;

    server {
        listen unix:/run/panel-static/static.sock;
        # The root comes from the web tier, the only one that reaches the
        # socket; it must be a site's public/ all the same.
        set $wsp_root $http_x_wsp_root;
        if ($wsp_root !~ "^/srv/sites/[^/]+/current/public$") {
            return 403;
        }
        root $wsp_root;
        index index.html index.htm;
        # PHP reaches PHP-FPM through the web tier, never here: its source
        # (and a dotfile) is not served even if something sent it.
        location ~ \.php$ {
            return 404;
        }
        location ~ /\.(?!well-known/) {
            return 404;
        }
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
