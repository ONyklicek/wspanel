# >>> WSPanel (managed by install.sh)
# Non-login SSH commands (`ssh host 'composer install'`) do not read
# /etc/profile.d; this puts the site's php/node first on PATH for them too.
# Users without a dir under /etc/panel-sites/bin are unaffected.
PATH		DEFAULT=/etc/panel-sites/bin/@{PAM_USER}:/usr/local/bin:/usr/bin:/bin
