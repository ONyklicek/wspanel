# >>> WSPanel (managed by install.sh)
# Non-login SSH commands (`ssh host 'composer install'`) do not read
# /etc/profile.d; this puts the site's php/node first on PATH for them too.
# It applies to every user, root too: the sbin dirs stay on it, or a root
# `ssh host 'curl … | bash'` finds no sysctl, useradd or nft.
PATH		DEFAULT=/etc/panel-sites/bin/@{PAM_USER}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
# <<< WSPanel
