; Managed by WSPanel install.sh. The panel itself: unprivileged, no sudo.
[panel]
user = panel
group = panel
listen = /run/php/php8.4-panel.sock
listen.owner = panel-web
listen.group = panel-web
listen.mode = 0660
pm = ondemand
; Live screens poll every few seconds and a few requests wait on the agent:
; five workers ran out with two or three tabs open (499 and 502 answers).
pm.max_children = 12
pm.process_idle_timeout = 120s
pm.max_requests = 1000
chdir = /
security.limit_extensions = .php
env[TMPDIR] = /srv/panel/tmp
php_admin_value[open_basedir] = /srv/panel/:/run/panel-agent.sock:/var/backups/wspanel/:/var/lib/wspanel-artifacts/
php_admin_value[upload_tmp_dir] = /srv/panel/tmp
; CI build artifacts (POST /api/deploy/{hook}/artifact)
php_admin_value[upload_max_filesize] = 512M
php_admin_value[post_max_size] = 520M
php_admin_value[sys_temp_dir] = /srv/panel/tmp
php_admin_value[session.save_path] = /srv/panel/tmp
php_admin_flag[display_errors] = off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,putenv,dl
