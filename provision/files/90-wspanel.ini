; WSPanel tuning for Laravel / Symfony (installed into every PHP version's fpm/conf.d and cli/conf.d)
expose_php = Off
memory_limit = 256M

opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
; Symfony and Laravel apps with vendor/ easily exceed the default 10000 files.
opcache.max_accelerated_files = 20000
; Timestamps are still validated until the deploy pipeline (atomic release +
; FPM reload) exists; then the panel switches this off per site.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Recommended by Symfony's performance guide.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
