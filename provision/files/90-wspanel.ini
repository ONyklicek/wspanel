; WSPanel tuning for Laravel / Symfony (installed into every PHP version's fpm/conf.d and cli/conf.d)
expose_php = Off
memory_limit = 256M

opcache.enable = 1
; One FPM master runs every site's pool and the panel's, and they share this
; cache: the panel alone has about 11 000 PHP files, a Laravel or Symfony site
; 6 000 to 12 000. Once it is full, new files are silently not cached and
; every request compiles them again. Memory is taken as it is used.
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 100000
opcache.max_wasted_percentage = 10
; Timestamps are still validated until the deploy pipeline (atomic release +
; FPM reload) exists; then the panel switches this off per site.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Recommended by Symfony's performance guide.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
