; Managed by WSPanel install.sh.
; PHP-FPM refuses to start without at least one pool. This idle pool keeps
; every installed version valid even when no site uses it (e.g. after the
; last site of a version is deleted). It never serves traffic: root-only
; socket, ondemand with a single child.
[wspanel-idle]
user = nobody
group = nogroup
listen = /run/php/php-fpm-idle-$pool.sock
listen.owner = root
listen.group = root
listen.mode = 0600
pm = ondemand
pm.max_children = 1
pm.process_idle_timeout = 10s
