# WSPanel as one container: a whole Debian 13 server with systemd (see
# docs/docker.md). For hosts where it cannot run natively, above all Windows
# with Docker Desktop (WSL2).
#
#   cp .env.example .env   # fill it in
#   docker compose up -d
#   docker compose logs -f  # the installation; the panel account at the end
#
# The container IS the server: its sites, databases and settings live in it.
# Do not "docker compose down", change the image or anything below that
# makes Docker recreate it: everything installed would be gone. Upgrades go
# through the panel (Zabezpečení → Aktualizace), inside the container.
name: wspanel
services:
  wspanel:
    image: ${WSPANEL_IMAGE:-ghcr.io/onyklicek/wspanel}:${WSPANEL_TAG:?WSPANEL_TAG: a version, e.g. 1.10.1 (never latest)}
    container_name: wspanel
    hostname: ${WSPANEL_HOSTNAME:-wspanel}
    restart: unless-stopped
    privileged: true          # systemd, ACLs, nftables (UFW) in the container's own namespaces
    cgroup: host
    tty: true                 # systemd's console (the installation's output) = docker logs
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./restore:/restore:ro   # a server backup to restore from (WSPANEL_RESTORE)
    env_file: .env
    ports:
      - "${WSPANEL_HTTP_PORT:-80}:80"
      - "${WSPANEL_PUBLIC_HTTPS_PORT:-443}:443"
      - "${WSPANEL_PUBLIC_HTTPS_PORT:-443}:443/udp"   # HTTP/3
      - "${WSPANEL_PUBLIC_SSH_PORT:-2222}:22"          # SSH/SFTP of the sites
      - "${WSPANEL_PANEL_PORT:-8443}:${WSPANEL_PANEL_PORT:-8443}" # the panel without a domain of its own
      # The mirror (Server → Zrcadlo): the primary connects to this container
      # through it. Only reachable by the paired node (mutual TLS).
      - "${WSPANEL_MIRROR_PORT:-7443}:7443"
      # Mail hosting (WSPANEL_ARGS=--mail-hosting=yes):
      # - "25:25"
      # - "465:465"
      # - "587:587"
      # - "993:993"
      # Game servers: their ports, e.g.
      # - "25565:25565"
